<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KFSA Gallery - Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap');

:root {
  --bg-primary: #0a0a0a;
  --bg-secondary: #141414;
  --bg-modal: #1a1a1a;
  --text-primary: #f5f5f5;
  --text-secondary: #cccccc;
  --text-tertiary: #888888;
  --border-light: rgba(255, 255, 255, 0.1);
  --border-medium: rgba(255, 255, 255, 0.2);
  --color-kf: #1346c8;
  --color-sa: #b82020;
  --color-gold: #c5a059;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* --- HERO SPLIT SCREEN --- */
.hero-split {
  position: relative;
  height: 70vh;
  min-height: 500px;
  display: flex;
  overflow: hidden;
  border-bottom: 1px solid var(--border-light);
}

.video-half {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.video-half video {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
  opacity: 0.4; /* Deixa o vídeo escuro para focar no texto */
  z-index: 0;
  transition: opacity 0.5s ease;
}

.video-half:hover video {
  opacity: 0.6;
}

.hero-letter {
  position: relative;
  z-index: 1;
  font-family: 'Playfair Display', serif;
  font-size: clamp(6rem, 15vw, 15rem);
  font-weight: 700;
  line-height: 1;
  text-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.hero-letter.kf { color: var(--color-kf); }
.hero-letter.sa { color: var(--color-sa); }

.hero-overlay-text {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 2.5rem 2rem;
  background: linear-gradient(to top, var(--bg-primary) 10%, transparent);
  text-align: center;
  z-index: 2;
}

.hero-byline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  letter-spacing: 4px;
  color: var(--text-secondary);
  font-style: italic;
  margin-bottom: 0.5rem;
}

.hero-name {
  font-size: 0.75rem;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

/* --- LAYOUT PRINCIPAL --- */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 3rem 2rem;
}

/* --- FILTROS EDITORIAIS --- */
.filter-section {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  margin-bottom: 3rem;
  border-bottom: 1px solid var(--border-light);
  padding-bottom: 2rem;
}

.search-bar {
  width: 100%;
  max-width: 400px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border-medium);
  color: var(--text-primary);
  font-size: 0.9rem;
  padding: 0.8rem 0;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.3s;
}

.search-bar:focus { border-color: var(--text-primary); }

.filter-group {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 0.7rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

.filter-btn {
  background: transparent;
  border: 1px solid var(--border-light);
  color: var(--text-secondary);
  padding: 0.5rem 1.2rem;
  border-radius: 2px;
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
}

.filter-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }
.filter-btn.active {
  background: var(--text-primary);
  color: var(--bg-primary);
  border-color: var(--text-primary);
}

/* --- GALLERY GRID --- */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 2.5rem 2rem;
}

.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.5rem;
  color: var(--text-tertiary);
}

/* --- CARDS DAS OBRAS --- */
.art-card {
  background: transparent;
  cursor: pointer;
  group: art;
}

.card-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4/5;
  overflow: hidden;
  margin-bottom: 1.2rem;
  background: var(--bg-secondary);
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.art-card:hover .card-img { transform: scale(1.04); }

.status-badge {
  position: absolute;
  top: 15px;
  right: 15px;
  padding: 4px 10px;
  font-size: 0.65rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  border: 1px solid var(--border-light);
  z-index: 2;
}

.status-badge.venda { color: #fff; border-color: var(--color-kf); }
.status-badge.vendido { color: var(--text-tertiary); }

.card-info {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--text-primary);
}

.card-tech {
  font-size: 0.75rem;
  color: var(--text-tertiary);
  letter-spacing: 0.5px;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border-light);
}

.card-price {
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 500;
  color: var(--color-gold);
}

.btn-buy {
  background: transparent;
  border: 1px solid var(--border-medium);
  color: var(--text-primary);
  padding: 0.5rem 1.2rem;
  font-size: 0.7rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-decoration: none;
  transition: all 0.3s ease;
}

.btn-buy:hover:not(.disabled) {
  background: var(--text-primary);
  color: var(--bg-primary);
}

.btn-buy.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  border-color: transparent;
}

/* --- MODAL CHIQUE (RESOLVIDO A TRANSPARÊNCIA) --- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(5px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.open {
  display: flex;
  opacity: 1;
}

.modal-content {
  background: var(--bg-modal); /* Fundo Sólido */
  border: 1px solid var(--border-light);
  width: 100%;
  max-width: 1000px;
  max-height: 90vh;
  display: flex;
  flex-direction: row;
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  overflow-y: auto;
}

.modal-close {
  position: absolute;
  top: 15px;
  right: 15px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 10;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-left {
  flex: 1;
  background: #000;
  position: relative;
  min-height: 400px;
}

.modal-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-right {
  flex: 1;
  padding: 3rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.m-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 400; margin-bottom: 0.5rem; line-height: 1.1; }
.m-tech { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-tertiary); margin-bottom: 2rem; }
.m-desc { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--text-secondary); margin-bottom: 1.5rem; line-height: 1.6;}
.m-hist { font-size: 0.9rem; color: var(--text-tertiary); line-height: 1.7; margin-bottom: 2.5rem; }

.m-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  margin-bottom: 2.5rem;
  padding-bottom: 2.5rem;
  border-bottom: 1px solid var(--border-light);
}

.m-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-tertiary); }
.m-value { font-size: 0.9rem; margin-top: 3px; }

.m-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.m-price { font-size: 1.6rem; color: var(--color-gold); font-family: 'Cormorant Garamond', serif; }

.btn-buy-large {
  background: var(--text-primary);
  color: var(--bg-primary);
  border: none;
  padding: 1rem 2rem;
  font-size: 0.8rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.2s;
}

.btn-buy-large:hover { transform: translateY(-2px); }
.btn-buy-large.disabled {
  background: var(--bg-secondary);
  color: var(--text-tertiary);
  cursor: not-allowed;
  transform: none;
}

/* Responsividade do Modal e Grid */
@media (max-width: 768px) {
  .modal-content { flex-direction: column; }
  .modal-left { min-height: 300px; }
  .modal-right { padding: 2rem; }
  .m-title { font-size: 1.8rem; }
  .hero-split { flex-direction: column; height: 100vh; }
  .video-half { width: 100%; height: 50%; }
}
</style>
</head>
<body>

<!-- HERO COM VÍDEOS DIVIDIDOS -->
<div class="hero-split">
  <div class="video-half">
    <!-- Substitua o src pelos seus vídeos reais -->
    <video src="./faiolhebra_2.mp4" autoplay loop muted playsinline></video>
    <div class="hero-letter kf">KF</div>
  </div>
  <div class="video-half">
    <video src="./faiolhebra_hd.mp4" autoplay loop muted playsinline></video>
    <div class="hero-letter sa">SA</div>
  </div>
  
  <div class="hero-overlay-text">
    <div class="hero-byline">Arte digital, emoção e contraste</div>
    <div class="hero-name">Kayque Faiolhe da Silva Alves</div>
  </div>
</div>

<div class="container">
  
  <!-- FILTROS EDITORIAIS -->
  <div class="filter-section">
    <input type="text" class="search-bar" id="searchInp" placeholder="Buscar por título, técnica, série..." oninput="applyFilters()">
    
    <div class="filter-group" id="cat-filters">
      <span class="filter-label">Acervo</span>
      <button class="filter-btn active" onclick="setFilter('cat', 'todas', this)">Tudo</button>
      <button class="filter-btn" onclick="setFilter('cat', 'quadros', this)">Quadros</button>
      <button class="filter-btn" onclick="setFilter('cat', 'desenhos', this)">Desenhos</button>
      <button class="filter-btn" onclick="setFilter('cat', 'livros', this)">Livros</button>
    </div>

    <div class="filter-group" id="status-filters">
      <span class="filter-label">Disponibilidade</span>
      <button class="filter-btn active" onclick="setFilter('status', 'todos', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('status', 'venda', this)">Disponível</button>
      <button class="filter-btn" onclick="setFilter('status', 'vendido', this)">Coleção Privada</button>
    </div>
  </div>

  <!-- GALERIA -->
  <div class="gallery" id="gallery"></div>
  <div class="no-results" id="noRes" style="display:none;">Nenhuma obra encontrada. O silêncio também é arte.</div>

</div>

<!-- MODAL PREMIUM -->
<div class="modal-overlay" id="modalScene" onclick="closeModal(event)">
  <div class="modal-content" id="modalBody" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal(event)" aria-label="Fechar">✕</button>
    
    <div class="modal-left">
      <img src="" alt="Obra" class="modal-img" id="mPhoto">
    </div>
    
    <div class="modal-right">
      <h2 class="m-title" id="mTitle"></h2>
      <div class="m-tech" id="mTech"></div>
      
      <div class="m-desc" id="mDesc"></div>
      <div class="m-hist" id="mHist"></div>
      
      <div class="m-grid">
        <div><div class="m-label">Ano</div><div class="m-value" id="mAno"></div></div>
        <div><div class="m-label">Dimensões</div><div class="m-value" id="mDim"></div></div>
        <div><div class="m-label">Série</div><div class="m-value" id="mSerie"></div></div>
        <div><div class="m-label">Status</div><div class="m-value" id="mStatus"></div></div>
      </div>
      
      <div class="m-action">
        <div class="m-price" id="mPrice"></div>
        <a href="#" class="btn-buy-large" id="mBuyBtn" target="_blank">Adquirir Obra</a>
      </div>
    </div>
  </div>
</div>

<script>
// Base de dados das obras incluindo Preço e Link de compra
const obras = [
  {
    titulo: "Silent Geometry", cat: "quadros",
    foto: "https://images.unsplash.com/photo-1547891654-e66ed7ebb968?q=80&w=1200",
    ano: "2024", tecnica: "Óleo sobre tela", dim: "90 × 120 cm", serie: "Silences", 
    status: "vendido", preco: "R$ 4.500", link: "#",
    desc: "Formas geométricas dialogam com o silêncio.",
    hist: "Criada durante um período de introspecção, Silent Geometry nasceu da obsessão do artista com o espaço negativo — o que não é pintado tem tanto peso quanto o que é."
  },
  {
    titulo: "Urban Echo", cat: "quadros",
    foto: "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=1200",
    ano: "2023", tecnica: "Acrílica sobre madeira", dim: "80 × 100 cm", serie: "Urban Feelings", 
    status: "venda", preco: "R$ 3.200", link: "#comprar-urban-echo",
    desc: "O isolamento nas grandes cidades.",
    hist: "Surgiu após três semanas andando pela cidade às 3h da manhã. O artista queria capturar o paradoxo de se sentir só em meio a milhões de pessoas."
  },
  {
    titulo: "White Emotion", cat: "quadros",
    foto: "https://images.unsplash.com/photo-1536924940846-227afb31e2a5?q=80&w=1200",
    ano: "2024", tecnica: "Aquarela sobre papel", dim: "60 × 80 cm", serie: "Whiteness", 
    status: "venda", preco: "R$ 2.800", link: "#comprar-white-emotion",
    desc: "Contraste minimalista como linguagem emocional.",
    hist: "A obra explora o branco não como ausência, mas como presença máxima. Pintada em uma única sessão de seis horas."
  },
  {
    titulo: "Fragments", cat: "desenhos",
    foto: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=1200",
    ano: "2025", tecnica: "Grafite e nanquim", dim: "42 × 59 cm", serie: "Deconstruct", 
    status: "venda", preco: "R$ 1.500", link: "#comprar-fragments",
    desc: "Descontinuidade, identidade e memória.",
    hist: "Primeiro trabalho da série Deconstruct, onde o artista rompe formas inteiras em fragmentos. Cada pedaço carrega uma memória visual independente."
  },
  {
    titulo: "Silêncio Editado", cat: "livros",
    foto: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1200",
    ano: "2023", tecnica: "Impressão offset · Capa dura", dim: "24 × 30 cm · 120p", serie: "Ed. limitada", 
    status: "vendido", preco: "R$ 350", link: "#",
    desc: "120 páginas do processo criativo.",
    hist: "O primeiro livro do artista reuniu três anos de obra que existia apenas em ateliê. Esgotou em 48 horas após o lançamento oficial."
  }
];

let state = { cat: 'todas', status: 'todos', search: '' };

function setFilter(type, value, btnElement) {
  state[type] = value;
  // Atualiza botões
  const container = btnElement.parentElement;
  container.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  applyFilters();
}

function applyFilters() {
  state.search = document.getElementById('searchInp').value.toLowerCase().trim();
  
  const filtradas = obras.filter(o => {
    const matchCat = state.cat === 'todas' || o.cat === state.cat;
    const matchStatus = state.status === 'todos' || o.status === state.status;
    const matchSearch = !state.search || 
                        o.titulo.toLowerCase().includes(state.search) || 
                        o.tecnica.toLowerCase().includes(state.search) ||
                        o.serie.toLowerCase().includes(state.search);
    return matchCat && matchStatus && matchSearch;
  });

  renderGallery(filtradas);
}

function renderGallery(lista) {
  const g = document.getElementById('gallery');
  const noRes = document.getElementById('noRes');
  
  if (!lista.length) {
    g.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  
  noRes.style.display = 'none';
  g.innerHTML = lista.map((o) => {
    const objIndex = obras.indexOf(o); // Pega o index real para o modal
    const isVenda = o.status === 'venda';
    const statusText = isVenda ? 'Disponível' : 'Vendido';
    const btnText = isVenda ? 'Comprar' : 'Esgotado';
    const btnClass = isVenda ? '' : 'disabled';
    const btnLink = isVenda ? `href="${o.link}" target="_blank"` : `href="javascript:void(0)"`;

    return `
      <div class="art-card" onclick="openModal(${objIndex})">
        <div class="card-img-wrap">
          <div class="status-badge ${o.status}">${statusText}</div>
          <img src="${o.foto}" class="card-img" alt="${o.titulo}" loading="lazy">
        </div>
        <div class="card-info">
          <h3 class="card-title">${o.titulo}</h3>
          <p class="card-tech">${o.ano} · ${o.tecnica}</p>
          <div class="card-footer">
            <span class="card-price">${o.preco}</span>
            <a ${btnLink} class="btn-buy ${btnClass}" onclick="event.stopPropagation()">${btnText}</a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openModal(index) {
  const o = obras[index];
  const isVenda = o.status === 'venda';
  
  document.getElementById('mPhoto').src = o.foto;
  document.getElementById('mTitle').textContent = o.titulo;
  document.getElementById('mTech').textContent = o.tecnica;
  document.getElementById('mDesc').textContent = `"${o.desc}"`;
  document.getElementById('mHist').textContent = o.hist;
  document.getElementById('mAno').textContent = o.ano;
  document.getElementById('mDim').textContent = o.dim;
  document.getElementById('mSerie').textContent = o.serie;
  document.getElementById('mStatus').textContent = isVenda ? 'Disponível' : 'Coleção Privada';
  document.getElementById('mPrice').textContent = o.preco;
  
  const btn = document.getElementById('mBuyBtn');
  if (isVenda) {
    btn.textContent = "Adquirir Obra";
    btn.href = o.link;
    btn.classList.remove('disabled');
  } else {
    btn.textContent = "Obra Indisponível";
    btn.href = "javascript:void(0)";
    btn.classList.add('disabled');
  }

  document.getElementById('modalScene').classList.add('open');
  document.body.style.overflow = 'hidden'; // Evita scroll atrás do modal
}

function closeModal(e) {
  if (e) e.preventDefault();
  document.getElementById('modalScene').classList.remove('open');
  document.body.style.overflow = 'auto';
}

// Fechar com ESC
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

// Inicialização
applyFilters();
</script>
</body>
</html>
